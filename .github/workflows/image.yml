name: Images
on:
  workflow_call:
    inputs:
      version:
        description: Release tag to publish, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Each platform builds on its own native runner, compiling licensee's native gems under emulation is slow
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Base images come through Google's Docker Hub mirror, as the shared runner IPs hit Docker Hub's anonymous pull limit
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the images by digest
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          PUSH_BY_DIGEST: "true"
        run: docker buildx bake --metadata-file "$RUNNER_TEMP/${{ matrix.runner }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.runner }}
          path: ${{ runner.temp }}/${{ matrix.runner }}.json
          retention-days: 1

  tag:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: metadata-*
          merge-multiple: true
          path: ${{ runner.temp }}/metadata

      # Base images come through Google's Docker Hub mirror, as the shared runner IPs hit Docker Hub's anonymous pull limit
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the multi-platform images
        env:
          VERSION: ${{ inputs.version }}
        run: .github/scripts/tag-images.sh "$RUNNER_TEMP"/metadata/*.json
