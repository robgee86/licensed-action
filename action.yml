name: licensed
description: Checks the committed dependency license records and NOTICE files with licensed in a Docker image, caching the ecosystem tooling between runs
author: robgee86

inputs:
  ecosystem:
    description: Ecosystem image to run, go, node, python, gradle-jdk17, gradle-jdk21, cocoapods, swift or react-native, the base image is used when empty
    default: ""
  dockerfile:
    description: Dockerfile extending one of the images, built and run in place of the ecosystem image, which still sets the dependency folder
    default: ""
  context:
    description: Build context of the dockerfile
    default: "."
  working-directory:
    description: Folder holding the licensed configuration, relative to the workspace
    default: "."
  setup:
    description: Shell commands run in the container before licensed, replacing the LICENSED_SETUP of the image
    default: ""
  cache-key-files:
    description: Newline separated globs of the files whose content keys the /cache directory, caching is off when empty
    default: ""
  github-token:
    description: Token granting access to private dependencies hosted on GitHub
    default: ""
  env:
    description: Names of environment variables of this step passed to the container, separated by spaces or newlines, such as a package registry token
    default: ""
  free-disk-space:
    description: Removes the toolchains of GitHub-hosted Linux runners that the images replace, such as the Android SDK, before the run, false when later steps of the job need them
    default: "true"

runs:
  using: composite
  steps:
    # The images bring their own toolchains, so the runner's copies only take the disk the dependencies and caches need
    - name: Free disk space
      if: inputs.free-disk-space == 'true' && runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        echo "Free before: $(df -h --output=avail / | tail -1)"
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
        echo "Free after: $(df -h --output=avail / | tail -1)"

    - name: Set up Docker Buildx
      if: inputs.dockerfile != ''
      uses: docker/setup-buildx-action@v3

    - name: Build the licensed image
      if: inputs.dockerfile != ''
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        tags: licensed:local
        load: true
        cache-from: type=gha,scope=licensed-action
        cache-to: type=gha,scope=licensed-action,mode=max

    # A stale cache is safe to restore, the ecosystem tools refresh whatever no longer matches
    - name: Cache the tooling
      if: inputs.cache-key-files != ''
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/licensed-cache
        key: licensed-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(inputs.cache-key-files) }}
        restore-keys: licensed-${{ runner.os }}-${{ runner.arch }}-

    - name: Run licensed
      id: licensed
      shell: bash
      env:
        VERSION: v0.6.0 # x-release-please-version
        ECOSYSTEM: ${{ inputs.ecosystem }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        LICENSED_CACHE_DIR: ${{ inputs.cache-key-files != '' && format('{0}/licensed-cache', runner.temp) || '' }}
        LICENSED_SETUP: ${{ inputs.setup }}
        LICENSED_GITHUB_TOKEN: ${{ inputs.github-token }}
        LICENSED_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        LICENSED_ENV: ${{ inputs.env }}
      run: |
        case "$ECOSYSTEM" in
          "") image="ghcr.io/robgee86/licensed:$VERSION" ;;
          go | node | python | gradle-jdk17 | gradle-jdk21 | cocoapods | swift | react-native) image="ghcr.io/robgee86/licensed-$ECOSYSTEM:$VERSION" ;;
          *) echo "::error::Unknown ecosystem $ECOSYSTEM, use go, node, python, gradle-jdk17, gradle-jdk21, cocoapods, swift or react-native"; exit 1 ;;
        esac
        # The folder where licensed reads the installed dependencies, kept in the cache
        case "$ECOSYSTEM" in
          python) export LICENSED_DEPENDENCIES=.venv ;;
          node) export LICENSED_DEPENDENCIES=node_modules ;;
          cocoapods) export LICENSED_DEPENDENCIES=Pods ;;
          swift) export LICENSED_DEPENDENCIES=.build ;;
          react-native) export LICENSED_DEPENDENCIES="node_modules ios/Pods" ;;
        esac
        export LICENSED_IMAGE="$([ -n "$DOCKERFILE" ] && echo licensed:local || echo "$image")"
        if "$GITHUB_ACTION_PATH/scripts/run.sh" licensed-check 2>&1 | tee "$RUNNER_TEMP/licensed.log"; then
          echo "outcome=success" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=failure" >> "$GITHUB_OUTPUT"
        fi

    - name: Report
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LICENSED_LOG: ${{ runner.temp }}/licensed.log
        LICENSED_OUTCOME: ${{ steps.licensed.outputs.outcome }}
      run: '"$GITHUB_ACTION_PATH/scripts/report.sh"'

branding:
  icon: check-circle
  color: green
